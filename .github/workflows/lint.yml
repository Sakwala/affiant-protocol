name: Fixture lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Validate fixtures against the schemas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: conformance/lint/package-lock.json

      - name: Install lint dependencies
        run: npm ci
        working-directory: conformance/lint

      - name: Lint fixtures
        run: node conformance/lint/lint.mjs
