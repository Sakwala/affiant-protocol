name: Fixture lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Validate fixtures against the schemas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: conformance/lint/package-lock.json

      - name: Install lint dependencies
        run: npm ci
        working-directory: conformance/lint

      # Both fixture sets, both schema directories: the seed examples against
      # `schemas/`, and the v0.1 fixtures against `schemas/0.1.0/` — where a
      # positive must validate and a negative must fail. Both fixture sections of
      # the conformance index are read here too, each against its own variant of
      # `fixture.schema.json`.
      - name: Lint fixtures
        run: node conformance/lint/lint.mjs

      # The three decisions in that file that are not about a document — whether a
      # workflow runs a cited script, whether a manifest is held to the v0.2
      # requirements, and whether its exemptions are the exemption file's — with the
      # mutation that caught each one written down beside it.
      - name: Fixture lint, its own decisions
        run: node conformance/lint/lint.mjs --self-test

      # CV-5's check, against its own corpus in `conformance/lint/adapter-claims.test/`
      # — a package per case and what the lint must say about it. It needs no network.
      #
      # This step is not decoration. `INVARIANTS.md` cites this script as CV-5's
      # coverage, and the coverage lint accepts a `lint:` citation only where a
      # workflow under `.github/workflows/` actually runs the script: a lint nobody
      # executes checks nothing, and a rule whose only coverage is an unrun file has no
      # coverage at all. Removing this step turns the coverage lint red, which is the
      # arrangement working.
      - name: Adapter claims lint, against its own corpus (CV-5)
        run: node conformance/lint/adapter-claims.mjs --self-test
